services:
  - type: web
    name: tiktok-downloader
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # BẮT BUỘC -w 1: link tải lưu trong bộ nhớ, nhiều worker sẽ làm link hết hạn giả
    startCommand: gunicorn -w 1 --threads 8 --timeout 300 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_KEY
        generateValue: true   # Render tự sinh khoá, xem trong tab Environment
      - key: GROQ_API_KEY
        sync: false           # tự điền trong Render > Environment, không để trong code
      - key: OUTBOUND_PROXY
        sync: false           # (tuỳ chọn) http://user:pass@host:port - proxy IP dân cư nếu tikwm/TikTok chặn IP Render
      - key: COOKIES_TXT
        sync: false           # (tuỳ chọn) nội dung cookies.txt để tải Instagram/Facebook/Threads cần đăng nhập
      - key: DISCORD_WEBHOOK
        sync: false           # (tuỳ chọn) link webhook Discord để nhận log mọi yêu cầu (link, IP, kết quả)
      - key: DISCORD_EVENTS
        sync: false           # (tuỳ chọn) lọc loại log gửi đi: info,get,ai,solve,ingest,error,diagnosis (mặc định gửi hết)
      - key: ERROR_AI
        value: "1"            # 0 = tắt AI tự chẩn đoán lỗi (vẫn ghi log); cần GROQ_API_KEY + DISCORD_WEBHOOK
      - key: ERROR_AI_HOURLY
        value: "6"            # tối đa số lần AI phân tích lỗi mỗi giờ (tiết kiệm hạn mức Groq dùng chung)
      - key: SOLVE_LIMIT
        value: "30"           # số bài giải mỗi IP trong 10 phút
