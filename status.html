<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Beysnap · Trạng thái</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --ok:#34c759; --bad:#ff3b30; --warn:#ff9f0a; --blue:#0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --line:#38383a; } }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 60px; } h1 { margin:0 0 4px; font-size:28px; letter-spacing:-.02em; }
  .sub { color:var(--muted); margin:0 0 20px; } .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-top:14px; }
  .card h2 { margin:0 0 10px; font-size:17px; } .row { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .row:first-of-type { border-top:0; } .row .n { flex:1; min-width:120px; font-weight:500; } .row .m { color:var(--muted); font-size:14px; }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--muted); flex:none; } .ok { background:var(--ok); } .bad { background:var(--bad); } .warn { background:var(--warn); }
  button { font:inherit; border:0; border-radius:999px; padding:9px 18px; background:var(--blue); color:#fff; font-weight:600; cursor:pointer; } button:disabled { opacity:.5; }
  a { color:var(--blue); } .big { display:flex; gap:12px; flex-wrap:wrap; } .big div { flex:1; min-width:120px; } .big b { display:block; font-size:22px; }
</style>
</head>
<body>
<main>
  <h1>Trạng thái Beysnap</h1>
  <p class="sub" id="sub">Đang tải…</p>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Kết nối tới các nguồn (đo trực tiếp)</h2><button id="probe">Kiểm tra ngay</button></div><div id="probeBox" class="m" style="margin-top:8px;color:var(--muted);font-size:14px">Bấm “Kiểm tra ngay” để đo độ trễ từ máy chủ tới TikTok, YouTube, Instagram…</div></div>
  <div class="card"><h2>Nguồn tải TikTok</h2><div id="src"></div></div>
  <div class="card"><h2>Tải trọng &amp; công cụ</h2><div class="big" id="load"></div><div id="tools" class="m" style="margin-top:10px;color:var(--muted);font-size:14px"></div></div>
  <div class="card"><h2>Lỗi trong 1 giờ qua</h2><div id="errs"></div></div>
  <p class="sub" style="margin-top:20px"><a href="/">← Về trang tải</a> · <a href="/docs">Tài liệu API</a></p>
</main>
<script>
const $ = id => document.getElementById(id);
const row = (state, name, meta) => { const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = '<span class="dot ' + state + '"></span><span class="n"></span><span class="m"></span>'; r.children[1].textContent = name; r.children[2].textContent = meta || ''; return r; };
const dur = s => s < 3600 ? Math.floor(s / 60) + ' phút' : s < 86400 ? (s / 3600).toFixed(1) + ' giờ' : (s / 86400).toFixed(1) + ' ngày';
function paint(d) {
  $('sub').textContent = 'Phiên bản ' + d.version + ' · máy chủ chạy được ' + dur(d.uptime_s) + (d.uptime_s < 120 ? ' (vừa khởi động, có thể do Render vừa đánh thức)' : '');
  const src = $('src'); src.replaceChildren();
  const t = d.tikwm, ts = { ok: 'ok', blocked: 'bad', error: 'warn', unknown: '' }[t.state] || '';
  src.append(row(ts, 'tikwm (nguồn chính)', { ok: 'đang chạy tốt', blocked: 'bị chặn IP, thử lại sau ' + t.blocked_for_s + ' giây', error: 'đang lỗi', unknown: 'chưa có dữ liệu' }[t.state] + ' · ' + t.ok + ' thành công / ' + t.fail + ' lỗi'));
  d.alt_providers.forEach(a => src.append(row(a.resting ? 'bad' : (a.ok ? 'ok' : (a.fail ? 'warn' : '')), a.name + ' (dự phòng)',
    (a.resting ? 'đang tạm nghỉ · ' : '') + a.ok + ' tốt / ' + a.fail + ' lỗi' + (a.avg_ms != null ? ' · ~' + a.avg_ms + ' ms' : ''))));
  if (!d.alt_providers.length) src.append(row('', 'Nguồn dự phòng', 'chưa được dùng lần nào (chỉ gọi khi tikwm lỗi)'));
  src.append(row(d.config.proxy ? 'ok' : '', 'Proxy đi ra (OUTBOUND_PROXY)', d.config.proxy ? 'đã cấu hình' : 'chưa đặt'));
  src.append(row(d.config.relay ? 'ok' : '', 'Relay Cloudflare', d.config.relay ? 'đã cấu hình' : 'không dùng'));
  src.append(row(d.config.ai ? 'ok' : '', 'AI (Groq)', d.config.ai ? 'sẵn sàng' : 'chưa có khoá'));
  const l = $('load'); l.replaceChildren();
  [['Zip đang chạy', d.load.active_jobs], ['Link đang giữ', d.load.tokens], ['Mục cache', d.load.cache], ['Luồng', d.load.threads]].forEach(([k, v]) => {
    const x = document.createElement('div'); x.innerHTML = '<b></b><span class="m"></span>'; x.children[0].textContent = v; x.children[1].textContent = k; x.children[1].style.color = 'var(--muted)'; l.append(x); });
  $('tools').textContent = 'yt-dlp: ' + (d.tools.yt_dlp || 'chưa cài') + ' · gallery-dl: ' + (d.tools.gallery_dl ? 'có' : 'không') + ' · curl-cffi: ' + (d.tools.curl_cffi ? 'có' : 'không');
  const e = $('errs'); e.replaceChildren(); const k = Object.entries(d.errors_last_hour);
  if (!k.length) e.append(row('ok', 'Không có lỗi nào', ''));
  k.sort((a, b) => b[1] - a[1]).forEach(([w, n]) => e.append(row(n > 10 ? 'bad' : 'warn', w, n + ' lần')));
}
function paintProbe(p) {
  const b = $('probeBox'); b.replaceChildren();
  Object.entries(p).forEach(([n, r]) => b.append(row(r.ok ? 'ok' : 'bad', n, r.ok ? r.ms + ' ms' : (r.code ? 'HTTP ' + r.code : 'không kết nối được') + (r.err ? ' (' + r.err + ')' : ''))));
}
async function load(probe) {
  const r = await fetch('/api/status' + (probe ? '?probe=1' : '')); const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Lỗi ' + r.status); paint(d); if (d.probe) paintProbe(d.probe);
}
$('probe').onclick = async () => { $('probe').disabled = true; $('probe').textContent = 'Đang đo…'; try { await load(true); } catch (e) { $('probeBox').textContent = e.message; } $('probe').disabled = false; $('probe').textContent = 'Kiểm tra ngay'; };
load().catch(e => { $('sub').textContent = e.message; }); setInterval(() => load().catch(() => {}), 15000);
</script>
</body>
</html>
